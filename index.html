<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Español en el Taller</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="IMG_1070.png">
<meta name="theme-color" content="#1b4f72">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0d2436;
    color: #f0f4f8;
    font-family: -apple-system, system-ui, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen { display: none; flex: 1; flex-direction: column; padding: 20px; }
  .screen.active { display: flex; }

  #menu-screen { align-items: center; justify-content: center; text-align: center; gap: 16px; }
  #menu-screen h1 { font-size: 1.6rem; margin: 0 0 8px; }

  .big-btn {
    background: #f4a21e; color: #1b1300; border: none; border-radius: 14px;
    padding: 18px 40px; font-size: 1.2rem; font-weight: 700; width: 100%;
    max-width: 280px;
  }
  .secondary-btn {
    background: #16344c; color: #f0f4f8; border: 1px solid #2a4f69; border-radius: 14px;
    padding: 14px 40px; font-size: 1rem; font-weight: 600; width: 100%; max-width: 280px;
  }
  button { touch-action: manipulation; }
  button:active { opacity: 0.8; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; }
  .topbar button { background: none; border: none; color: #c3d3de; font-size: 1rem; padding: 8px; flex-shrink: 0; }
  .progress { font-size: 1rem; color: #c3d3de; }
  .timer { font-size: 1rem; color: #c3d3de; }

  #session-screen { align-items: center; justify-content: center; }
  .card-wrap {
    width: 100%; max-width: 360px; aspect-ratio: 4/3; perspective: 1200px;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.4s; transform-style: preserve-3d;
  }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
    background: #16344c; border-radius: 20px; display: flex; align-items: center;
    justify-content: center; text-align: center; padding: 24px; font-size: 1.75rem;
    font-weight: 600; overflow-y: auto; flex-direction: column; gap: 8px;
  }
  .card-back { transform: rotateY(180deg); background: #1b4f72; }
  .card-sub { font-size: 1.25rem; font-weight: 400; color: #c3d3de; margin-top: 10px; }

  .grading-row, .next-row { display: flex; gap: 12px; margin-top: 20px; width: 100%; max-width: 360px; }
  .grading-row button, .next-row button {
    flex: 1; padding: 16px; border-radius: 12px; border: none; font-size: 1.05rem; font-weight: 700;
  }
  .got-it-btn { background: #2e7d4f; color: white; }
  .missed-btn { background: #a33a3a; color: white; }
  .next-btn { background: #f4a21e; color: #1b1300; }

  .peek-row { display: none; justify-content: center; margin-top: 14px; width: 100%; max-width: 360px; }
  .peek-btn { padding: 12px 20px; font-size: 0.95rem; width: auto; user-select: none; -webkit-user-select: none; }

  #summary-screen { align-items: center; justify-content: center; text-align: center; gap: 10px; }
  #summary-screen h2 { font-size: 1.4rem; margin-bottom: 4px; }
  .summary-line { font-size: 1.1rem; color: #c3d3de; }

  #options-screen { gap: 4px; overflow-y: auto; }
  #options-screen h2 { font-size: 1.2rem; margin: 18px 0 10px; }
  #options-screen h2:first-of-type { margin-top: 6px; }

  .toggle-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 4px;
    border-bottom: 1px solid #16344c; font-size: 1.05rem;
  }
  .toggle-row input[type="checkbox"] {
    width: 24px; height: 24px; flex-shrink: 0; accent-color: #f4a21e;
  }
  .toggle-row label { flex: 1; }

  .slider-row { padding: 10px 4px 6px; }
  .slider-value { font-weight: 700; color: #f4a21e; }
  .slider-row input[type="range"] {
    width: 100%; margin-top: 10px; accent-color: #f4a21e;
  }
</style>
</head>
<body>

<div id="menu-screen" class="screen active">
  <h1 id="app-title"></h1>
  <button id="play-btn" class="big-btn"></button>
  <button id="money-btn" class="secondary-btn"></button>
  <button id="options-btn" class="secondary-btn"></button>
</div>

<div id="options-screen" class="screen">
  <div class="topbar">
    <button id="options-back-btn"></button>
  </div>

  <h2 id="options-directions-heading"></h2>
  <div class="toggle-row">
    <input type="radio" name="direction" id="dir-es-en">
    <label for="dir-es-en" id="dir-es-en-label"></label>
  </div>
  <div class="toggle-row">
    <input type="radio" name="direction" id="dir-en-es">
    <label for="dir-en-es" id="dir-en-es-label"></label>
  </div>
  <div class="toggle-row">
    <input type="radio" name="direction" id="dir-mixed">
    <label for="dir-mixed" id="dir-mixed-label"></label>
  </div>

  <h2 id="options-categories-heading"></h2>
  <div class="toggle-row">
    <input type="checkbox" id="cat-words">
    <label for="cat-words" id="cat-words-label"></label>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="cat-phrases">
    <label for="cat-phrases" id="cat-phrases-label"></label>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="cat-questions">
    <label for="cat-questions" id="cat-questions-label"></label>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="cat-numbers">
    <label for="cat-numbers" id="cat-numbers-label"></label>
  </div>

  <h2 id="options-money-heading"></h2>
  <div class="toggle-row">
    <input type="checkbox" id="money-whole">
    <label for="money-whole" id="money-whole-label"></label>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="money-cents">
    <label for="money-cents" id="money-cents-label"></label>
  </div>
  <div class="slider-row">
    <span id="money-max-label"></span> <span id="money-max-value" class="slider-value"></span>
    <input type="range" id="money-max-slider" min="0" max="6" step="1">
  </div>

  <h2 id="options-session-length-heading"></h2>
  <div class="slider-row">
    <span id="session-length-value" class="slider-value"></span>
    <input type="range" id="session-length-slider" min="5" max="50" step="5">
  </div>

  <h2 id="options-timer-heading"></h2>
  <div class="toggle-row">
    <input type="checkbox" id="show-timer">
    <label for="show-timer" id="show-timer-label"></label>
  </div>
</div>

<div id="session-screen" class="screen">
  <div class="topbar">
    <button id="end-session-btn"></button>
    <div class="timer" id="timer-text" style="display:none;"></div>
    <div class="progress" id="progress-text"></div>
  </div>
  <div class="card-wrap" id="card-wrap">
    <div class="card-inner" id="card-inner">
      <div class="card-face card-front" id="card-front"></div>
      <div class="card-face card-back" id="card-back"></div>
    </div>
  </div>
  <div class="grading-row" id="grading-row" style="display:none;">
    <button id="missed-btn" class="missed-btn"></button>
    <button id="gotit-btn" class="got-it-btn"></button>
  </div>
  <div class="next-row" id="next-row" style="display:none;">
    <button id="next-btn" class="next-btn"></button>
  </div>
  <div class="peek-row" id="peek-row">
    <button id="peek-btn" class="secondary-btn peek-btn" type="button"></button>
  </div>
</div>

<div id="summary-screen" class="screen">
  <h2 id="summary-title"></h2>
  <div class="summary-line" id="summary-cards"></div>
  <div class="summary-line" id="summary-correct"></div>
  <div class="summary-line" id="summary-time"></div>
  <button id="play-again-btn" class="big-btn" style="margin-top:20px;"></button>
  <button id="summary-menu-btn" class="secondary-btn"></button>
</div>

<script src="js/config.js"></script>
<script src="js/es-numbers.js"></script>
<script src="js/app.js"></script>
</body>
</html>
